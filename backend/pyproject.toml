[project]
name = "agrichain-sentinel"
version = "0.1.0"
description = "ML-driven blockchain framework for detecting fraudulent agricultural supply-chain transactions"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "scikit-learn>=1.9,<1.10",  # pinned: artifacts/model.joblib is a pickle
    "pandas",
    "numpy",
    "shap",
    "joblib",
    "python-dotenv",
    "networkx",
    "web3>=7,<9",  # talks to the AgriChainLedger smart contract on the Ethereum node
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "eth-tester[py-evm]>=0.13.0b1"]  # eth-tester: in-process EVM for tests

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
